services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      HTTP_ADDR: ":8080"
      STORAGE_BACKEND: "clickhouse"
      FRONTEND_DIR: ""
      CLICKHOUSE_DSN: "clickhouse://recap:recap@clickhouse:9000/recap"
      SEED_DEMO_DATA: "true"
      PROFILES_PATH: "seeds/profiles.json"
      SCENARIOS_PATH: "seeds/scenarios.json"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:3000,http://localhost:5173"
      AI_NARRATIVE_PROVIDER: "${AI_NARRATIVE_PROVIDER:-auto}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      AI_NARRATIVE_TIMEOUT: "120s"
      AI_NARRATIVE_MAX_CONCURRENCY: "${AI_NARRATIVE_MAX_CONCURRENCY:-2}"
    depends_on:
      clickhouse:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recap

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - recap

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: recap
      CLICKHOUSE_PASSWORD: recap
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user recap --password recap --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - recap

  kafka:
    image: apache/kafka:3.9.2
    profiles: ["events-gen"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:9092,EXTERNAL://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Не пересоздает кластер - не падает с ошибкой "Другой id" при перезапуске
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9093" # host localhost:9092 -> container's EXTERNAL listener
    # Увеличиваем количество файлов, которые может затрагивать процесс
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - recap

  # Kafka engine table + materialized view that feed recap.events from the topic.
  clickhouse-kafka-init:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["events-gen"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./clickhouse/kafka:/sql:ro
    entrypoint:
      - sh
      - -c
      - "clickhouse-client --host clickhouse --user recap --password recap --multiquery < /sql/010_events_kafka.sql"
    networks:
      - recap

  # Публикуем события в Kafka через наш сервис (по идее они должны приходить из реального приложения)
  eventgen:
    build:
      context: .
      dockerfile: Dockerfile
      target: eventgen
    profiles: ["events-gen"]
    environment:
      EVENTGEN_KAFKA_BROKERS: "kafka:9092"
      EVENTGEN_KAFKA_TOPIC: "events"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - recap

  ollama:
    image: ollama/ollama:latest
    container_name: avito-recap-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - recap

volumes:
  clickhouse_data:
  ollama_data:

networks:
  recap:
    driver: bridge
