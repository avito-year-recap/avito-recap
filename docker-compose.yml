#Не засоряем логами память
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Основной сервис
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      FRONTEND_DIR: ""
      #
      CLICKHOUSE_DSN: "clickhouse://recap:recap@clickhouse:9000/recap?compress=lz4&max_open_conns=20&max_idle_conns=10&conn_max_lifetime=30m"
      SEED_DEMO_DATA: "true"
      PROFILES_PATH: "seeds/profiles.json"
      SCENARIOS_PATH: "seeds/scenarios.json"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:3000,http://localhost:5173"
    depends_on:
      clickhouse:
        condition: service_healthy
    logging: *default-logging
    networks:
      - recap

  # Nginx - конфигуация редактируется в проекте, зависит от поднятого бекенда
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *default-logging
    networks:
      - recap

  # Основная база проекта. Выбрана для оптимизированной работы с аналитическими системами
  # Хранит данные в колоночных таблицах + оптимизация под хранения - временные ряды занимают
  # намного меньше места, по сравнению с Postgres
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: recap
      CLICKHOUSE_PASSWORD: recap
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    # Увеличиваем количество файлов, которые может затрагивать процесс
    # (У кликхауса создается много файлов при оптимизации таблиц)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Перед стартом проверяем, что все запустилось
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user recap --password recap --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *default-logging
    networks:
      - recap

  # Имитация очереди реальных данных - в случае подключения к продовскому сервису. Опционально.
  #  docker compose --profile events-gen up -d kafka clickhouse-kafka-init
  #  docker compose --profile events-gen run --rm eventgen
  kafka:
    image: apache/kafka:3.9.2
    profiles: ["events-gen"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Не пересоздает кластер - не падает с ошибкой "Другой id" при перезапуске
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Увеличиваем количество файлов, которые может затрагивать процесс
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging
    networks:
      - recap

  # Kafka engine table + materialized view that feed
  clickhouse-kafka-init:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["events-gen"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./clickhouse/kafka:/sql:ro
    entrypoint:
      - sh
      - -c
      - "clickhouse-client --host clickhouse --user recap --password recap --multiquery < /sql/010_events_kafka.sql"
    networks:
      - recap

  # Публикуем события в Kafka через наш сервис (по идее они должны приходить из реального приложения)
  eventgen:
    build:
      context: .
      dockerfile: Dockerfile
      target: eventgen
    profiles: ["events-gen"]
    environment:
      EVENTGEN_KAFKA_BROKERS: "kafka:9092"
      EVENTGEN_KAFKA_TOPIC: "events"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - recap

volumes:
  clickhouse_data:

networks:
  recap:
    driver: bridge
