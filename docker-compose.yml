services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      CLICKHOUSE_DSN: "clickhouse://recap:recap@clickhouse:9000/recap"
      SEED_DEMO_DATA: "true"
      PROFILES_PATH: "seeds/profiles.json"
      SCENARIOS_PATH: "seeds/scenarios.json"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - recap

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - recap

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: recap
      CLICKHOUSE_PASSWORD: recap
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user recap --password recap --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - recap

volumes:
  clickhouse_data:

networks:
  recap:
    driver: bridge
