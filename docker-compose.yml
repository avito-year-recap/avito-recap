services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      API_ADDRESS: ":8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
