x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${API_IMAGE:-ghcr.io/avito-year-recap/avito-recap-api:latest}
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      FRONTEND_DIR: ""
      CLICKHOUSE_DSN: "clickhouse://recap:recap@clickhouse:9000/recap?compress=lz4&max_open_conns=20&max_idle_conns=10&conn_max_lifetime=30m"
      SEED_DEMO_DATA: "true"
      PROFILES_PATH: "seeds/profiles.json"
      SCENARIOS_PATH: "seeds/scenarios.json"
      CORS_ALLOWED_ORIGINS: "http://176.12.77.144"
      AI_NARRATIVE_PROVIDER: "${AI_NARRATIVE_PROVIDER:-auto}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      AI_NARRATIVE_TIMEOUT: "120s"
      AI_NARRATIVE_MAX_CONCURRENCY: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
    logging: *default-logging
    networks:
      - recap

  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/avito-year-recap/avito-recap-nginx:latest}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *default-logging
    networks:
      - recap

  # Не публикуем 8123/9000 наружу - в деве это нужно для отладки,
  # в проде ClickHouse доступен только внутри docker-сети по имени сервиса.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: recap
      CLICKHOUSE_PASSWORD: recap
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user recap --password recap --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *default-logging
    networks:
      - recap

  # Хост ограничен 4 ГБ RAM / 2 vCPU. Замер на проде: qwen3:4b под Ollama
  # держит пик ~2.6 ГБ RSS и почти полностью занимает оба ядра во время
  # генерации. Лимиты ниже не дают ему задушить ClickHouse/api по памяти
  # и оставляют второе ядро остальным сервисам - ценой более медленной
  # генерации. При нехватке памяти контейнер убьётся по OOM и поднимется
  # заново по restart-политике; приложение при этом падает на детерминиро-
  # ванный текст рекапа (AI - best-effort, не обязателен для ответа).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 2.5g
    cpus: "1"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    logging: *default-logging
    networks:
      - recap

volumes:
  clickhouse_data:
  ollama_data:

networks:
  recap:
    driver: bridge
