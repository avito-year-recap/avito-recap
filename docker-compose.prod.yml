x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${API_IMAGE:-ghcr.io/avito-year-recap/avito-recap-api:latest}
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      STORAGE_BACKEND: "clickhouse"
      FRONTEND_DIR: ""
      CLICKHOUSE_DSN: "clickhouse://recap:recap@clickhouse:9000/recap?compress=lz4&max_open_conns=20&max_idle_conns=10&conn_max_lifetime=30m"
      SEED_DEMO_DATA: "true"
      PROFILES_PATH: "seeds/profiles.json"
      SCENARIOS_PATH: "seeds/scenarios.json"
      CORS_ALLOWED_ORIGINS: "http://176.12.77.144"
      AI_NARRATIVE_PROVIDER: "${AI_NARRATIVE_PROVIDER:-auto}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      AI_NARRATIVE_TIMEOUT: "120s"
      AI_NARRATIVE_MAX_CONCURRENCY: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
    logging: *default-logging
    networks:
      - recap

  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/avito-year-recap/avito-recap-nginx:latest}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *default-logging
    networks:
      - recap

  # Не публикуем 8123/9000 наружу - в деве это нужно для отладки,
  # в проде ClickHouse доступен только внутри docker-сети по имени сервиса.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: recap
      CLICKHOUSE_PASSWORD: recap
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user recap --password recap --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: *default-logging
    networks:
      - recap

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 2.5g
    cpus: "1"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    logging: *default-logging
    networks:
      - recap

  kafka:
    image: apache/kafka:3.9.2
    profiles: ["events-gen"]
    mem_limit: 1g
    mem_reservation: 768m
    cpus: "0.5"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging
    networks:
      - recap

  clickhouse-kafka-init:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["events-gen"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./clickhouse/kafka:/sql:ro
    entrypoint:
      - sh
      - -c
      - "clickhouse-client --host clickhouse --user recap --password recap --multiquery < /sql/010_events_kafka.sql"
    networks:
      - recap

  eventgen:
    image: ${EVENTGEN_IMAGE:-ghcr.io/avito-year-recap/avito-recap-eventgen:latest}
    profiles: ["events-gen"]
    environment:
      EVENTGEN_KAFKA_BROKERS: "kafka:9092"
      EVENTGEN_KAFKA_TOPIC: "events"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging
    networks:
      - recap

volumes:
  clickhouse_data:
  ollama_data:

networks:
  recap:
    driver: bridge
