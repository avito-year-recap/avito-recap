name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/avito-recap-api
  IMAGE_NGINX: ghcr.io/${{ github.repository_owner }}/avito-recap-nginx
  IMAGE_EVENTGEN: ghcr.io/${{ github.repository_owner }}/avito-recap-eventgen

jobs:
  build-and-push:
    name: Build & push images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NGINX }}:latest
            ${{ env.IMAGE_NGINX }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build & push eventgen image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: eventgen
          push: true
          tags: |
            ${{ env.IMAGE_EVENTGEN }}:latest
            ${{ env.IMAGE_EVENTGEN }}:${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf,clickhouse/kafka"
          target: "/opt/avito-recap"
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 6m
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_API,IMAGE_NGINX,SHA
          script: |
            cd /opt/avito-recap
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            IMAGE_API="$IMAGE_API" IMAGE_NGINX="$IMAGE_NGINX" \
              API_IMAGE="$IMAGE_API:$SHA" NGINX_IMAGE="$IMAGE_NGINX:$SHA" \
              docker compose -f docker-compose.prod.yml pull
            API_IMAGE="$IMAGE_API:$SHA" NGINX_IMAGE="$IMAGE_NGINX:$SHA" \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_API: ${{ env.IMAGE_API }}
          IMAGE_NGINX: ${{ env.IMAGE_NGINX }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
