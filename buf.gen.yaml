version: v2

plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
    out: .
    opt:
      - module=github.com/year-recap
  - local:
      - go
      - run
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
    out: .
    opt:
      - module=github.com/year-recap
  - local:
      - npx
      - --yes
      - "@bufbuild/protoc-gen-es@2.13.0"
    out: gen/ts
    opt:
      - target=ts
